[package]
name = "gale"
version = "0.1.0"
edition = "2024"
default-run = "gale"

[workspace]

# CPU-side solver library: reference elements, mesh, DG operators, solvers.
# Pure host code (no cuda-oxide); GPU kernels live in the binaries / device modules.
[lib]
name = "gale"
path = "src/lib.rs"

# Default binary: the original vecadd scaffold.
[[bin]]
name = "gale"
path = "src/main.rs"

# Milestone-1 sm_70 (Volta) probe: device inventory, FP64 arithmetic + libdevice
# sqrt, FP64 shared-memory cooperation, and multi-GPU peer-to-peer.
# Run: cargo oxide run --bin probe-sm70
[[bin]]
name = "probe-sm70"
path = "src/bin/probe_sm70.rs"

# Isolated FP64 transcendental probe (exp / ln / powf) — the log-conformation
# math gale will need. Separate binary so a codegen/libdevice build failure here
# (cf. cuda-oxide issue #98 / PR #69) cannot break the core probe above.
# Run: cargo oxide run --bin probe-fp64-math
[[bin]]
name = "probe-fp64-math"
path = "src/bin/probe_fp64_math.rs"

# Reproducer / regression gate for cuda-oxide issue #58 (nested-array writes
# through get_mut silently dropped). Libdevice-free (PTX path).
# Run: cargo oxide run --bin probe-nested-write
[[bin]]
name = "probe-nested-write"
path = "src/bin/probe_nested_write.rs"

[[bin]]
name = "exper-kernel"
path = "src/bin/exper_kernel.rs"

# GPU port step 7a: matrix-free DG volume-stiffness kernel, validated vs the CPU
# oracle. Run: cargo oxide run --bin gpu-poisson-volume
[[bin]]
name = "gpu-poisson-volume"
path = "src/bin/gpu_poisson_volume.rs"

# GPU port step 7b: SIPG face/flux terms, validated vs the CPU oracle.
# Run: cargo oxide run --bin gpu-poisson-faces
[[bin]]
name = "gpu-poisson-faces"
path = "src/bin/gpu_poisson_faces.rs"

[dependencies]
# TEMPORARY PIN to our fork's `pr-101-typed-nvvm` branch (= cuda-oxide PR #101,
# "typed NVVM IR for pre-Blackwell"), which fixes the libdevice
# `nvvmCompileProgram: "parse expected type"` failure on the Volta Titan V (sm_70)
# — issue #98, reproduced in docs/milestone-1-probe-results.md.
# Pinned by rev for reproducibility; the branch is ours to carry our own follow-up
# fixes (e.g. the residual typed-pointer bitcast bug). The matching codegen backend
# must be built from this commit and exposed via CUDA_OXIDE_BACKEND — see
# .cargo/config.toml. Revert to `{ git = "https://github.com/NVlabs/cuda-oxide.git" }`
# once #101 (and our fixes) merge upstream.
# Pinned to our fork branch fix/typed-pointer-insertvalue-bitcast, which carries the
# typed-pointer bitcast fix (codegen backend) and cuda-core::memory::memcpy_peer_async
# (multi-GPU P2P halo). The matching backend .so must be built from this commit and
# exposed via CUDA_OXIDE_BACKEND (.cargo/config.toml). Revert to NVlabs once merged.
cuda-device = { git = "https://github.com/ianrgraham/cuda-oxide.git", rev = "965c4366d892dbbdacd72c87f08f429b9ea2b666" }
cuda-host   = { git = "https://github.com/ianrgraham/cuda-oxide.git", rev = "965c4366d892dbbdacd72c87f08f429b9ea2b666" }
cuda-core   = { git = "https://github.com/ianrgraham/cuda-oxide.git", rev = "965c4366d892dbbdacd72c87f08f429b9ea2b666" }

# GPU port step 7c: full SIPG operator (volume + faces, 2-kernel pipeline).
# Run: cargo oxide run --bin gpu-poisson-operator
[[bin]]
name = "gpu-poisson-operator"
path = "src/bin/gpu_poisson_operator.rs"

# GPU port step 7d: conjugate gradient entirely on the GPU.
# Run: cargo oxide run --bin gpu-poisson-cg
[[bin]]
name = "gpu-poisson-cg"
path = "src/bin/gpu_poisson_cg.rs"

# GPU port step 7f: p-multigrid V-cycle preconditioner + PCG, fully on-device.
# Run: cargo oxide run --bin gpu-poisson-pcg
[[bin]]
name = "gpu-poisson-pcg"
path = "src/bin/gpu_poisson_pcg.rs"

# GPU port: hyperbolic conservation-law operator (weak form, linear advection).
# Run: cargo oxide run --bin gpu-advection
[[bin]]
name = "gpu-advection"
path = "src/bin/gpu_advection.rs"

# GPU port: Oldroyd-B conformation transport rhs (direct form, element-local).
# Run: cargo oxide run --bin gpu-oldroyd
[[bin]]
name = "gpu-oldroyd"
path = "src/bin/gpu_oldroyd.rs"

# GPU port: split-form (entropy-stable) Burgers operator.
# Run: cargo oxide run --bin gpu-burgers-split
[[bin]]
name = "gpu-burgers-split"
path = "src/bin/gpu_burgers_split.rs"

# GPU port: volume-penalization apply (immersed rigid bodies).
# Run: cargo oxide run --bin gpu-penalize
[[bin]]
name = "gpu-penalize"
path = "src/bin/gpu_penalize.rs"

# GPU port: compressible Euler weak-form operator (libdevice sqrt — needs §1 fix).
# Run: cargo oxide run --bin gpu-euler
[[bin]]
name = "gpu-euler"
path = "src/bin/gpu_euler.rs"

# GPU port: log-conformation viscoelastic transport (eig + matrix exp — needs §1 fix).
# Run: cargo oxide run --bin gpu-logconf
[[bin]]
name = "gpu-logconf"
path = "src/bin/gpu_logconf.rs"

# Live multi-GPU advection across 2 devices with P2P halo exchange.
# Run: cargo oxide run --bin gpu-multigpu
[[bin]]
name = "gpu-multigpu"
path = "src/bin/gpu_multigpu.rs"
