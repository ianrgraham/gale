[package]
name = "gale"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["gale-gpu"]

# cuda-oxide runtime crates, pinned to our local fork checkout (path deps) so the
# whole workspace shares ONE source and matches the codegen backend built from the
# same checkout (CUDA_OXIDE_BACKEND in .cargo/config.toml). The fork carries our
# fixes: typed-pointer bitcast, NVVM dialect default, memcpy_peer_async (P2P), and
# the cross-crate artifact-anchor linking that makes `gale-gpu` reusable. The fork
# branch (fix/typed-pointer-insertvalue-bitcast) is pushed to GitHub; switch these
# to a git rev pin (or upstream NVlabs) once the fixes merge.
[workspace.dependencies]
cuda-device = { path = "/home/ian/src/cuda-oxide-101/crates/cuda-device" }
cuda-host = { path = "/home/ian/src/cuda-oxide-101/crates/cuda-host" }
cuda-core = { path = "/home/ian/src/cuda-oxide-101/crates/cuda-core" }

# CPU-side solver library: reference elements, mesh, DG operators, solvers.
# PURE host code (no cuda-oxide), so plain `cargo test` builds it with the standard
# codegen backend and serves as the bit-for-bit CPU oracle. All GPU device code +
# launch wrappers live in the `gale-gpu` member crate, which depends on this one.
[lib]
name = "gale"
path = "src/lib.rs"

# Host-side CPU parallelism (data-parallel build/setup, e.g. the p-MG diagonal
# probing + power-iteration). Pure host crate — does not touch the GPU path.
[dependencies]
rayon = "1"
