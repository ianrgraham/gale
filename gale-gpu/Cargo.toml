[package]
name = "gale-gpu"
version = "0.1.0"
edition = "2024"

# GPU device-code + host launch wrappers for gale's DG operators. Built ONLY via
# `cargo oxide` (it contains `#[cuda_module]` device code the cuda-oxide codegen
# backend must lower). Depends on the pure-host `gale` lib for State/mesh/operator
# types; `gale` does NOT depend on this crate, so `gale`'s `cargo test` stays a
# pure-host CPU oracle. Reusable across crates thanks to the fork's cross-crate
# artifact-anchor fix.
[lib]
name = "gale_gpu"
path = "src/lib.rs"

[dependencies]
gale = { path = ".." }
cuda-device = { workspace = true }
cuda-host = { workspace = true }
cuda-core = { workspace = true }

# Cross-crate validation: a consumer binary that calls the library kernel and
# checks it against gale's CPU oracle (exercises the dependency-rlib link path).
# Run: cargo oxide run --bin advection-check
[[bin]]
name = "advection-check"
path = "src/bin/advection_check.rs"

# Cross-crate framework GPU execution: a Simulation driven by a GPU-backed
# semidiscretization (gale_gpu::GpuAdvection impl of gale's StateSemi), checked
# against an identical CPU-backed run. Run: cargo oxide run --bin sim-gpu-check
[[bin]]
name = "sim-gpu-check"
path = "src/bin/sim_gpu_check.rs"

# --- Migrated GPU operator / probe binaries -------------------------------------
# These were one-off binaries under gale/src/bin. They live here now so gale stays
# a pure-host crate (all `#[cuda_module]` device code is in gale-gpu). Each remains
# a standalone harness validating a GPU kernel against gale's CPU oracle; promoting
# them to reusable library components (like gale_gpu::advection) is incremental.

# The original vecadd scaffold (cuda-oxide smoke test).
[[bin]]
name = "vecadd"
path = "src/bin/vecadd.rs"

# Milestone-1 sm_70 (Volta) probe: device inventory, FP64 arithmetic + libdevice
# sqrt, FP64 shared-memory cooperation, and multi-GPU peer-to-peer.
[[bin]]
name = "probe-sm70"
path = "src/bin/probe_sm70.rs"

# Isolated FP64 transcendental probe (exp / ln / powf) — log-conformation math.
[[bin]]
name = "probe-fp64-math"
path = "src/bin/probe_fp64_math.rs"

# Reproducer / regression gate for cuda-oxide issue #58 (nested-array writes).
[[bin]]
name = "probe-nested-write"
path = "src/bin/probe_nested_write.rs"

[[bin]]
name = "exper-kernel"
path = "src/bin/exper_kernel.rs"

# GPU port step 7a: matrix-free DG volume-stiffness kernel.
[[bin]]
name = "gpu-poisson-volume"
path = "src/bin/gpu_poisson_volume.rs"

# GPU port step 7b: SIPG face/flux terms.
[[bin]]
name = "gpu-poisson-faces"
path = "src/bin/gpu_poisson_faces.rs"

# Validates gale_gpu::poisson_apply (operators::poisson SIPG operator A·u).
[[bin]]
name = "poisson-operator-check"
path = "src/bin/poisson_operator_check.rs"

# Validates gale_gpu::poisson_cg_solve (operators::poisson on-device CG).
[[bin]]
name = "poisson-cg-check"
path = "src/bin/poisson_cg_check.rs"

# Validates gale_gpu::poisson_pcg_solve (operators::poisson p-multigrid PCG).
[[bin]]
name = "poisson-pcg-check"
path = "src/bin/poisson_pcg_check.rs"

# Validates gale_gpu::helmholtz_cg_solve (operators::poisson viscous Helmholtz CG).
[[bin]]
name = "helmholtz-check"
path = "src/bin/helmholtz_check.rs"

# Validates gale_gpu::pressure_cg_solve (operators::poisson deflated Neumann CG).
[[bin]]
name = "pressure-check"
path = "src/bin/pressure_check.rs"

# Validates gale_gpu::GpuStokes (flow) unsteady-Stokes solver vs CPU + analytic.
[[bin]]
name = "stokes-check"
path = "src/bin/stokes_check.rs"

# Validates gale_gpu::GpuStokesIntegrator driving Simulation (framework GPU flow).
[[bin]]
name = "sim-stokes-check"
path = "src/bin/sim_stokes_check.rs"

# Validates the GPU Navier–Stokes path (GpuStokes::step_ns + GpuDualSplitting).
[[bin]]
name = "ns-check"
path = "src/bin/ns_check.rs"

# Validates the coupled GPU viscoelastic flow (GpuViscoelasticDualSplitting).
[[bin]]
name = "ve-check"
path = "src/bin/ve_check.rs"

# Validates the reusable gale_gpu::advection3d_rhs (operators::advection3d) component.
[[bin]]
name = "advection3d-check"
path = "src/bin/advection3d_check.rs"

# Validates the reusable gale_gpu::oldroyd_conf_rhs (operators::oldroyd) component.
[[bin]]
name = "oldroyd-check"
path = "src/bin/oldroyd_check.rs"

# Validates the reusable gale_gpu::burgers_rhs (operators::burgers) component.
[[bin]]
name = "burgers-check"
path = "src/bin/burgers_check.rs"

# Validates the reusable gale_gpu::penalize_apply (immersed) library component.
[[bin]]
name = "penalize-check"
path = "src/bin/penalize_check.rs"

# Validates the reusable gale_gpu::euler_rhs (operators::euler) component.
[[bin]]
name = "euler-check"
path = "src/bin/euler_check.rs"

# Validates the reusable gale_gpu::logconf_psi_rhs (operators::logconf) component.
[[bin]]
name = "logconf-check"
path = "src/bin/logconf_check.rs"

# Validates gale_gpu::multigpu_advection_2d (distributed, 2-device P2P) vs CPU.
[[bin]]
name = "multigpu-check"
path = "src/bin/multigpu_check.rs"

# Validates gale_gpu::multigpu_advection_3d (distributed, 2-device P2P) vs CPU.
[[bin]]
name = "multigpu3d-check"
path = "src/bin/multigpu3d_check.rs"
