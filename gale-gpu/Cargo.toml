path = "src/bin/probe_generic_kernel.rs"

# std::autodiff → cargo-oxide → cuda-host end-to-end probe (needs `autodiff`).
[[bin]]
name = "ad-probe-check"
path = "src/bin/ad_probe_check.rs"
required-features = ["autodiff"]

# gale's REAL implicit_relax differentiated via the automated path (needs `autodiff`).
[[bin]]
